name: pangolin_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.12
  - htslib
  - setuptools<70
  - pip
  - pip:
    - pangolin
    - gffutils
    - biopython
    - pyfaidx
    - pyvcf3
    - pandas
    - pysam
    - torch --extra-index-url https://download.pytorch.org/whl/cpu
